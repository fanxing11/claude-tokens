[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccstats"
version = "0.1.0"
description = "Token usage and cost analyzer for Claude Code session logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mengfanxing" }]
keywords = ["claude", "claude-code", "tokens", "usage", "cost", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ccstats = "ccstats.cli:main"

[project.urls]
Homepage = "https://github.com/mengfanxing/ccstats"
Repository = "https://github.com/mengfanxing/ccstats"
Issues = "https://github.com/mengfanxing/ccstats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ccstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
